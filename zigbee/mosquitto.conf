# Broker for the Zigbee contact sensors.
#
# Bound to the loopback address on purpose. Both the application and
# Zigbee2MQTT use host networking and reach it at 127.0.0.1, so there is no
# reason for it to answer the network — and an open broker on the LAN would
# let anyone publish heating-relevant sensor state.
listener 1883 127.0.0.1
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
