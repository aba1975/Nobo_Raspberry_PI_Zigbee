; Firmware for the M5Stack PaperColor wall display.
; Build and flash:  pio run -e papercolor -t upload
; Then set it up:   python provision.py --help
; Nothing secret is built in: Wi-Fi, address, key and certificate are sent over
; USB afterwards and kept in the device's own storage.

[env:papercolor]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
lib_deps =
    m5stack/M5Unified@^0.2.5
    m5stack/M5GFX@^0.2.17
    bblanchon/ArduinoJson@^7.2.0
monitor_speed = 115200
