; Firmware for the M5Stack PaperColor wall display.
; Build and flash:  pio run -e papercolor -t upload
; Then set it up:   python provision.py --help
; Nothing secret is built in: Wi-Fi, address, key and certificate are sent over
; USB afterwards and kept in the device's own storage.

[env:papercolor]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
lib_deps =
    m5stack/M5Unified@^0.2.5
    ; develop, not a release: 0.2.33 and earlier wait only 20 s for a refresh
    ; that takes about 35 s here, then send POWER_OFF while the panel is still
    ; refreshing, and red, green and blue come out dull. Fixed upstream on
    ; 6 Oct 2026 (ED2208: let AUTO run the refresh). Move back to a release
    ; once one includes it.
    https://github.com/m5stack/M5GFX.git#6f819295da148a8117f3ef1c31937ff9ed621ad7
    bblanchon/ArduinoJson@^7.2.0
monitor_speed = 115200
