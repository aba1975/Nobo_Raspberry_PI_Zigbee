[pytest]
# The application modules live in app/ and import each other by plain name
# (import auth, import away_schedule, ...), so app/ has to be on sys.path.
# Setting it here means "python -m pytest" works from the repository root,
# which is what the README and CLAUDE.md tell people to run (QA defect D-03).
pythonpath = app
testpaths = tests

# Demo mode is forced in tests/conftest.py before the app is imported, so the
# suite never talks to a real hub and no extra plugin is needed here.

filterwarnings =
    ignore::DeprecationWarning
