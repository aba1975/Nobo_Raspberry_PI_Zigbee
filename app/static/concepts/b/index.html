<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>Concept B &mdash; Room First | Nob&oslash; Control</title>
<link rel="stylesheet" href="/static/concepts/shared/base.css?v=1">
<link rel="stylesheet" href="/static/concepts/b/b.css?v=1">
</head>
<body>

<div class="np-banner">
  <span><strong>Design concept B &mdash; Room First.</strong> A prototype, not the live app.</span>
  <a href="/static/concepts/index.html">Compare concepts</a>
  <a href="/">Back to the current app</a>
</div>

<!-- The room switcher is the navigation. There are no pages. -->
<nav class="rail" aria-label="Rooms">
  <button class="rail-arrow np-tap" id="prevRoom" aria-label="Previous room">&#8249;</button>
  <div class="rail-track" id="rail" role="tablist" aria-label="Choose a room"></div>
  <button class="rail-arrow np-tap" id="nextRoom" aria-label="Next room">&#8250;</button>
</nav>

<main class="stage" id="stage" aria-live="polite">
  <p class="stage-loading">Reading your home&hellip;</p>
</main>

<footer class="dock">
  <button class="dock-btn np-tap" id="allRoomsBtn" type="button">
    <span class="dock-glyph" aria-hidden="true">&#9638;</span> All rooms
  </button>
  <p class="dock-conn" id="conn"><span class="conn-dot" aria-hidden="true"></span><span id="connText">Connecting</span></p>
  <button class="dock-btn np-tap" id="houseBtn" type="button">
    <span class="dock-glyph" aria-hidden="true">&#9737;</span> House
  </button>
</footer>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-inner" id="sheetInner"></div>
</section>

<script src="/static/concepts/shared/core.js?v=1"></script>
<script src="/static/concepts/b/b.js?v=1"></script>
</body>
</html>
