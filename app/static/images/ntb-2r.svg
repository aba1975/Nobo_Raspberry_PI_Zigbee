<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <!-- Device body -->
  <rect x="10" y="10" width="100" height="60" rx="6" fill="#e8f0f7" stroke="#5a8bbd" stroke-width="2"/>
  
  <!-- Screen/display area -->
  <rect x="20" y="20" width="80" height="35" rx="3" fill="#2c4a6b" opacity="0.8"/>
  
  <!-- Display text lines -->
  <rect x="30" y="28" width="40" height="4" rx="2" fill="#4a90d9" opacity="0.9"/>
  <rect x="30" y="38" width="25" height="4" rx="2" fill="#4a90d9" opacity="0.7"/>
  <rect x="30" y="45" width="35" height="3" rx="1.5" fill="#4a90d9" opacity="0.6"/>
  
  <!-- Temperature indicator -->
  <circle cx="85" cy="37.5" r="12" fill="#5a8bbd" opacity="0.3"/>
  <text x="85" y="43" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c4a6b" text-anchor="middle">°C</text>
  
  <!-- Control buttons -->
  <circle cx="35" cy="62" r="4" fill="#5a8bbd" opacity="0.6"/>
  <circle cx="60" cy="62" r="4" fill="#5a8bbd" opacity="0.6"/>
  <circle cx="85" cy="62" r="4" fill="#5a8bbd" opacity="0.6"/>
</svg>
