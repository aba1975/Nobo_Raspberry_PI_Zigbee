<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <!-- Convector heater body -->
  <rect x="20" y="20" width="80" height="45" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <!-- Convector fins (vertical) -->
  <line x1="35" y1="25" x2="35" y2="60" stroke="#2196F3" stroke-width="1.5"/>
  <line x1="45" y1="25" x2="45" y2="60" stroke="#2196F3" stroke-width="1.5"/>
  <line x1="55" y1="25" x2="55" y2="60" stroke="#2196F3" stroke-width="1.5"/>
  <line x1="65" y1="25" x2="65" y2="60" stroke="#2196F3" stroke-width="1.5"/>
  <line x1="75" y1="25" x2="75" y2="60" stroke="#2196F3" stroke-width="1.5"/>
  <line x1="85" y1="25" x2="85" y2="60" stroke="#2196F3" stroke-width="1.5"/>
  <!-- Heat waves (top) -->
  <path d="M 40 13 Q 43 10, 46 13" fill="none" stroke="#ff8c42" stroke-width="1.5" opacity="0.6"/>
  <path d="M 58 13 Q 61 10, 64 13" fill="none" stroke="#ff8c42" stroke-width="1.5" opacity="0.6"/>
  <path d="M 76 13 Q 79 10, 82 13" fill="none" stroke="#ff8c42" stroke-width="1.5" opacity="0.6"/>
  <!-- Full control indicator (comfort+eco) -->
  <circle cx="27" cy="38" r="5" fill="#E74C3C" opacity="0.8"/>
  <text x="27" y="41.5" font-family="Arial,sans-serif" font-size="5.5" fill="white" text-anchor="middle" font-weight="bold">C</text>
  <circle cx="27" cy="49" r="5" fill="#27ae60" opacity="0.8"/>
  <text x="27" y="52.5" font-family="Arial,sans-serif" font-size="5.5" fill="white" text-anchor="middle" font-weight="bold">E</text>
  <!-- Label -->
  <text x="60" y="75" font-family="Arial,sans-serif" font-size="8" fill="#1565c0" text-anchor="middle" font-weight="bold">NCU-2R</text>
</svg>
