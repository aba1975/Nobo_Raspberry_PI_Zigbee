services:
  nobo-web-control:
    build: .
    container_name: nobo-web-control
    network_mode: host
    restart: always
    environment:
      - NOBO_SERIAL=${NOBO_SERIAL:-111111111111}
      - NOBO_IP=${NOBO_IP:-10.0.0.100}
      - NOBO_DEMO=${NOBO_DEMO:-false}
      - NOBO_ALLOW_ANON_API=${NOBO_ALLOW_ANON_API:-false}
      # Which interface answers "/". Both ship in the image and both are always
      # reachable at /cabin and /classic, so switching back is this one line
      # plus a restart - no rebuild, and no loss of any other fix.
      - NOBO_UI=${NOBO_UI:-cabin}
      # Where the application listens.
      #
      # 0.0.0.0 (the default) means anyone on your network can reach it on
      # port 8000 over plain HTTP. Set this to 127.0.0.1 when you run the TLS
      # proxy below: the application is then reachable only through Caddy, and
      # the unencrypted port stops answering the network entirely.
      - NOBO_BIND=${NOBO_BIND:-0.0.0.0}
      - NOBO_PORT=${NOBO_PORT:-8000}
      # Only read when the contact-sensor provider is set to
      # zigbee2mqtt; harmless otherwise.
      - NOBO_MQTT_URL=${NOBO_MQTT_URL:-mqtt://127.0.0.1:1883}
    volumes:
      - nobo-data:/app/data
      # Containers default to UTC, but week schedules are wall-clock times, so
      # without this a "07:00" schedule fires at the wrong hour (QA defect D-06).
      # Mounting the host clock files makes the container follow whatever
      # timezone the Raspberry Pi is set to. Read-only.
      #
      # A TZ environment variable is deliberately NOT set here: an empty TZ is
      # treated as UTC by the C library, which would override these files and
      # reintroduce the bug for everyone who has not set TZ in their .env.
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('NOBO_PORT', '8000') + '/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # HTTPS, for people who would rather not send their password across the
  # network in clear text. Off unless you ask for it:
  #
  #   docker compose --profile tls up -d
  #
  # By default Caddy issues the certificate from its own private CA: nothing to
  # register, no DNS records, no ports open to the internet, and no expiry to
  # forget. You install its root certificate once per device. Set
  # NOBO_CADDYFILE to ./tls/Caddyfile.acme instead if you want a Let's Encrypt
  # certificate that every device already trusts.
  #
  # See "HTTPS on Your Own Network" in the README.
  caddy:
    profiles: ["tls"]
    build:
      context: ./tls
      args:
        # caddy-stock is the official binary and needs no compiling. Only the
        # ACME path needs caddy-plugins, which rebuilds Caddy from source with
        # a DNS provider — several minutes on a Pi. BuildKit skips the stage it
        # is not asked for, so the default costs nothing.
        CADDY_BINARY_SOURCE: ${CADDY_BINARY_SOURCE:-caddy-stock}
        CADDY_DNS_PLUGIN: ${CADDY_DNS_PLUGIN:-github.com/caddy-dns/acmedns}
    container_name: nobo-caddy
    # Host networking for the same reason the application uses it: this is a
    # LAN service, reached by a name that resolves to the Pi's own address.
    network_mode: host
    restart: always
    depends_on:
      - nobo-web-control
    environment:
      - NOBO_DOMAIN=${NOBO_DOMAIN:-}
      - NOBO_TLS_EMAIL=${NOBO_TLS_EMAIL:-}
      - NOBO_PORT=${NOBO_PORT:-8000}
      - ACMEDNS_USERNAME=${ACMEDNS_USERNAME:-}
      - ACMEDNS_PASSWORD=${ACMEDNS_PASSWORD:-}
      - ACMEDNS_SUBDOMAIN=${ACMEDNS_SUBDOMAIN:-}
      - ACMEDNS_SERVER_URL=${ACMEDNS_SERVER_URL:-https://auth.acme-dns.io}
    volumes:
      - ${NOBO_CADDYFILE:-./tls/Caddyfile}:/etc/caddy/Caddyfile:ro
      # The CA and the certificates live here. If this is not persisted, every
      # restart generates a brand new root — and every device you installed the
      # old one on starts warning again.
      - caddy-data:/data
      - caddy-config:/config

  # Zigbee contact sensors, for people who want to know a window was left open.
  # Off unless you ask for it, the same way HTTPS is:
  #
  #   COMPOSE_PROFILES=zigbee   in .env
  #
  # A Nobø-only installation starts neither of these and needs no dongle, no
  # broker and no extra memory. See docs/SENSORS.md.
  #
  # The application talks to Zigbee2MQTT only through MQTT, deliberately: the
  # radio stack stays out of the process that owns the hub socket, so a Zigbee
  # fault cannot take the heating with it.
  mosquitto:
    profiles: ["zigbee"]
    image: eclipse-mosquitto:2
    container_name: nobo-mosquitto
    # Host networking so the application, which also uses it, can reach the
    # broker on the loopback address. The listener is bound to 127.0.0.1 in
    # mosquitto.conf, so the broker never answers the network.
    network_mode: host
    restart: always
    volumes:
      - ./zigbee/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  zigbee2mqtt:
    profiles: ["zigbee"]
    image: koenkk/zigbee2mqtt:${ZIGBEE2MQTT_TAG:-2.14.1}
    container_name: nobo-zigbee2mqtt
    network_mode: host
    restart: always
    depends_on:
      - mosquitto
    devices:
      # The by-id path, never /dev/ttyUSB0: USB device numbering is not stable
      # across reboots, and pointing a coordinator at the wrong adapter is not
      # a failure that announces itself.
      - ${NOBO_ZIGBEE_ADAPTER:-/dev/null}:/dev/ttyUSB0
    volumes:
      # Holds the network key and the device database. Losing it means
      # re-pairing every sensor by hand, so it belongs in scripts/backup.sh.
      - zigbee2mqtt-data:/app/data
      - /run/udev:/run/udev:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Zigbee2MQTT stamps its own log lines in UTC regardless of
      # /etc/localtime, which the container otherwise honours - `date` inside
      # it is already correct. Two hours of offset between its log and the
      # application's is a nuisance exactly when you are correlating them to
      # work out why a sensor did something.
      #
      # Defaulted to UTC rather than left empty on purpose: an empty TZ is
      # read as UTC by the C library anyway, and would look like it had been
      # configured when it had not. Set NOBO_TZ to your own zone.
      - TZ=${NOBO_TZ:-UTC}
      # Stamp each report with when the device actually spoke.
      #
      # Without this the only timestamp available is when *we* received the
      # message, and a broker replays retained messages on every reconnect —
      # so each restart would reset "last heard" for every sensor, including
      # the ones whose batteries are flat, which is the case it exists for.
      #
      # Set here rather than in the configuration file because that file is
      # generated inside the volume on first run, so a fresh installation
      # would otherwise not have it.
      - ZIGBEE2MQTT_CONFIG_ADVANCED_LAST_SEEN=ISO_8601
      # The Zigbee channel, and the one setting here that cannot be taken back.
      #
      # Deliberately empty by default. Zigbee2MQTT ignores an empty
      # ZIGBEE2MQTT_CONFIG_* variable, so an installation that never sets this
      # keeps whatever channel its network was formed on — which is the only
      # safe default, because changing the channel of a *running* mesh strands
      # every sleepy end device until it is re-paired by hand, at the window it
      # is stuck to.
      #
      # Choose it before pairing anything. docs/SENSORS.md explains the survey;
      # the short version is that the Zigbee2MQTT default of 11 sits inside
      # Wi-Fi 1, and 15, 20 or 25 are the gaps between Wi-Fi 1/6/11.
      - ZIGBEE2MQTT_CONFIG_ADVANCED_CHANNEL=${NOBO_ZIGBEE_CHANNEL:-}
      # Coordinator transmit power in dBm.
      #
      # The ZBDongle-P this project documents is a CC2652P with a power
      # amplifier and will do 20; its firmware default is 5, so leaving this
      # unset throws away most of the range the hardware was bought for. Costs
      # nothing, needs no re-pairing, and is reversible.
      #
      # It raises only what the *coordinator* shouts, never what a battery
      # sensor can whisper back, so it improves a marginal link but cannot
      # rescue one the sensor's own radio cannot reach. Routers do that.
      #
      # Lower it to 5 for an adapter with no amplifier — a bare CC2652RB, or a
      # ZBDongle-E — which cannot reach 20 and will log the attempt as an error.
      - ZIGBEE2MQTT_CONFIG_ADVANCED_TRANSMIT_POWER=${NOBO_ZIGBEE_TRANSMIT_POWER:-20}

volumes:
  nobo-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  mosquitto-data:
    driver: local
  zigbee2mqtt-data:
    driver: local
